name: COS monorepo

on:
  push:
    paths:
      - "cos/**"
      - ".github/workflows/cos-ci.yml"
  pull_request:
    paths:
      - "cos/**"
      - ".github/workflows/cos-ci.yml"

defaults:
  run:
    working-directory: cos

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cos/package-lock.json
      - name: Install workspaces
        run: npm ci
      - name: Lint web
        run: npm run web:lint
      - name: Build web
        run: npm run web:build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API deps
        run: pip3 install -r apps/api/requirements.txt
        working-directory: cos
      - name: Import check
        run: python3 -c "import app.main"
        working-directory: cos/apps/api
        env:
          PYTHONPATH: .
