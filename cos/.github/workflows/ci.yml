# Runs at repository root when this folder is the whole repo (e.g. after
# `git subtree split -P cos` from everything-claude-code).

name: CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: .

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspaces
        run: npm ci
      - name: Lint web
        run: npm run web:lint
      - name: Build web
        run: npm run web:build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API deps
        run: pip3 install -r apps/api/requirements.txt
      - name: Import check
        run: python3 -c "import app.main"
        working-directory: apps/api
        env:
          PYTHONPATH: .
